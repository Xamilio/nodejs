<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Subtle Background Grid/Pattern -->
  <g opacity="0.05">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800 M 0 400 H 800" stroke="#ffffff" stroke-width="1" />
    <path d="M 100 0 V 450 M 200 0 V 450 M 300 0 V 450 M 400 0 V 450 M 500 0 V 450 M 600 0 V 450 M 700 0 V 450" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Decorative Glows -->
  <circle cx="680" cy="100" r="140" fill="#10b981" opacity="0.15" />
  <circle cx="120" cy="350" r="120" fill="#3b82f6" opacity="0.12" />

  <!-- Central Graphic (Book + Star) -->
  <g transform="translate(330, 80) scale(1.6)">
    <!-- Book pages -->
    <path d="M 10 60 Q 35 40 60 60 Q 85 40 110 60 L 110 120 Q 85 100 60 120 Q 35 100 10 120 Z" fill="url(#emeraldGrad)" opacity="0.95" />
    <path d="M 60 60 L 60 120" stroke="#0f172a" stroke-width="3" />
    <path d="M 22 75 Q 38 63 52 75" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M 22 92 Q 38 80 52 92" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M 68 75 Q 82 63 98 75" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9" />
    <path d="M 68 92 Q 82 80 98 92" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.9" />
  </g>

  <!-- Badge Tag -->
  <rect x="300" y="270" width="200" height="32" rx="16" fill="url(#goldGrad)" />
  <text x="400" y="291" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">
    ★ FORMAT: SVG ★
  </text>

  <!-- Main Title -->
  <text x="400" y="340" font-family="'Lora', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">
    Городская Библиотека «Читальня»
  </text>
  <text x="400" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Векторное баннерное изображение высокого качества (.svg)
  </text>
</svg>